<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prenota un appuntamento · Ottica Visual Care</title>
<style>
/* OPTYKER_BOOKING_STATIC_V3 */
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7f9;color:#17324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.w{max-width:820px;margin:auto;padding:16px}.hero{background:#173e69;color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}.brand{font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;opacity:.8}.hero h1{margin:4px 0 6px;font-size:28px;line-height:1.1}.hero p{margin:0;opacity:.86;font-size:13px}.card{background:#fff;border:1px solid #d9e4ec;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px rgba(23,50,74,.04)}.cardTitle{font-size:17px;font-weight:900;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}label{font-size:11px;font-weight:900;color:#4f6678}input,select,textarea{width:100%;min-height:44px;border:1px solid #cbd8e2;border-radius:10px;padding:10px 11px;background:#fff;color:#17324a;font:inherit}textarea{min-height:90px;resize:vertical}.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:45px}.slot{border:1px solid #b9cbd8;background:#fff;border-radius:10px;padding:9px 12px;font-weight:850;color:#173e69;cursor:pointer;text-align:left}.slot:hover{background:#f3f8fb}.slot.on{background:#173e69;color:#fff;border-color:#173e69}.slotTime{display:block;font-size:13px}.slotMeta{display:block;font-size:9px;font-weight:700;opacity:.78;margin-top:2px}.svcDot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}.btn{width:100%;border:0;border-radius:12px;background:#1769aa;color:#fff;padding:13px 16px;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.msg{min-height:22px;padding-top:9px;font-size:12px}.ok{color:#147a3e}.bad{color:#b42323}.empty{color:#6f8291;font-size:12px;padding:9px 0}.summary{display:none;margin:12px 0 0;padding:10px 12px;border:1px solid #d7e5ee;border-radius:10px;background:#f7fbfd;font-size:11px;color:#506a7d}.summary.show{display:block}@media(max-width:620px){.w{padding:10px}.hero{border-radius:15px;padding:18px}.hero h1{font-size:24px}.card{border-radius:14px;padding:14px}.grid{grid-template-columns:1fr}.f.full{grid-column:auto}.slot{flex:1 1 calc(50% - 8px);min-width:130px}}
</style>
</head>
<body>
<div class="w">
  <div class="hero"><div class="brand">Ottica Visual Care</div><h1>Prenota un appuntamento</h1><p>Agenda unica: il sistema assegna automaticamente uno dei due studi disponibili.</p></div>
  <div class="card"><div class="cardTitle">Scegli quando</div><div class="grid">
    <div class="f full"><label>Servizio</label><select id="service"><option value="">Caricamento servizi…</option></select></div>
    <div class="f"><label>Operatore</label><select id="operator"><option value="">Qualsiasi operatore</option></select></div>
    <div class="f"><label>Data</label><input id="date" type="date"></div>
  </div><div style="margin-top:14px"><label>Orari disponibili</label><div id="slots" class="slots"><div class="empty">Seleziona servizio e data.</div></div></div><div id="summary" class="summary"></div></div>
  <div class="card"><div class="cardTitle">I tuoi dati</div><div class="grid">
    <div class="f"><label>Nome</label><input id="first" autocomplete="given-name"></div>
    <div class="f"><label>Cognome</label><input id="last" autocomplete="family-name"></div>
    <div class="f"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
    <div class="f"><label>Telefono</label><input id="phone" type="tel" autocomplete="tel"></div>
    <div class="f full"><label>Note</label><textarea id="notes" placeholder="Informazioni utili per l’appuntamento"></textarea></div>
  </div><button id="book" class="btn" disabled>Conferma appuntamento</button><div id="msg" class="msg"></div></div>
</div>
<script>
(function(){/* OPTYKER_BOOKING_STATIC_V3 */
const API='https://whgziwaegjzqsgcntesr.supabase.co/functions/v1/optyker-appointments-booking';
const S={cfg:null,slot:null};
const E=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(q,opt){const r=await fetch(API+(q||''),opt);const x=await r.json();if(!r.ok||x?.ok===false)throw Error(x?.error||'Errore di collegamento');return x}
function service(){return S.cfg?.services?.find(x=>x.id===E('service').value)||null}
function t(v){return new Date(v).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function renderCfg(){const sv=S.cfg.services||[],op=S.cfg.operators||[];E('service').innerHTML='<option value="">Seleziona un servizio</option>'+sv.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');E('operator').innerHTML='<option value="">Qualsiasi operatore</option>'+op.map(x=>'<option value="'+esc(x.username)+'">'+esc(x.username)+'</option>').join('')}
function clearChoice(){S.slot=null;E('book').disabled=true;E('summary').className='summary';E('summary').textContent=''}
async function slots(){clearChoice();const sid=E('service').value,d=E('date').value;if(!sid||!d){E('slots').innerHTML='<div class="empty">Seleziona servizio e data.</div>';return}E('slots').innerHTML='<div class="empty">Caricamento disponibilità…</div>';try{let q='?api=slots&service_id='+encodeURIComponent(sid)+'&date='+encodeURIComponent(d);if(E('operator').value)q+='&operator='+encodeURIComponent(E('operator').value);const x=await api(q),a=x.data||[];E('slots').innerHTML=a.length?a.map((s,i)=>'<button type="button" class="slot" data-i="'+i+'"><span class="slotTime">'+esc(t(s.starts_at))+'</span><span class="slotMeta">'+esc(s.operator_username)+'</span></button>').join(''):'<div class="empty">Nessun orario disponibile per questa selezione.</div>';E('slots').querySelectorAll('.slot').forEach(b=>b.onclick=()=>{E('slots').querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.slot=a[+b.dataset.i];E('book').disabled=false;const svc=service();E('summary').innerHTML='<span class="svcDot" style="background:'+esc(svc?.color||'#1769aa')+'"></span><b>'+esc(svc?.name||'Appuntamento')+'</b> · '+esc(new Date(S.slot.starts_at).toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long'}))+' alle '+esc(t(S.slot.starts_at))+' · '+esc(S.slot.operator_username);E('summary').className='summary show'})}catch(e){E('slots').innerHTML='<div class="bad">'+esc(e.message)+'</div>'}}
async function init(){const x=await api('?api=config');S.cfg=x;renderCfg();const n=new Date();n.setDate(n.getDate()+1);const today=new Date();E('date').min=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');E('date').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');['service','operator','date'].forEach(id=>E(id).addEventListener('change',slots));const p=new URLSearchParams(location.search);[['first','first_name'],['last','last_name'],['email','email'],['phone','phone']].forEach(([id,k])=>{if(p.get(k))E(id).value=p.get(k)});slots()}
E('book').onclick=async()=>{const m=E('msg');m.className='msg';m.textContent='';if(!S.slot)return;const p={service_id:E('service').value,studio_id:null,operator_username:S.slot.operator_username,rule_id:S.slot.rule_id,starts_at:S.slot.starts_at,first_name:E('first').value.trim(),last_name:E('last').value.trim(),email:E('email').value.trim(),phone:E('phone').value.trim(),notes:E('notes').value.trim(),source:new URLSearchParams(location.search).get('source')||'web'};if(!p.first_name||!p.last_name||!p.email||!p.phone){m.className='msg bad';m.textContent='Compila nome, cognome, email e telefono.';return}E('book').disabled=true;m.textContent='Conferma in corso…';try{await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});m.className='msg ok';m.textContent='Appuntamento confermato. Ti aspettiamo!';await slots()}catch(e){m.className='msg bad';m.textContent=e.message;E('book').disabled=false}};
init().catch(e=>{E('slots').innerHTML='<div class="bad">'+esc(e.message)+'</div>'});
})();
</script>
</body>
</html>
