<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scheda OTTICA VISUAL CARE</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#f4f7fa;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17324a}
    #staffFrame{display:none;width:100%;height:900px;min-height:760px;border:0;background:#fff}
    #state{min-height:760px;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#6d7f8f;font-size:13px}
    #state strong{display:block;color:#17324a;font-size:16px;margin-bottom:6px}
  </style>
</head>
<body>
  <div id="state"><div><strong>Caricamento area operatore…</strong>Attendi un momento.</div></div>
  <iframe id="staffFrame" title="Area operatore OTTICA VISUAL CARE"></iframe>
  <script>
  (async function(){
    const state=document.getElementById('state');
    const frame=document.getElementById('staffFrame');
    const token=new URLSearchParams(location.search).get('t')||'';
    const BASE='https://whgziwaegjzqsgcntesr.supabase.co/functions/v1/optyker-shopify-staff-embed';
    function fail(){state.innerHTML='<div><strong>Impossibile caricare l’area operatore</strong>Ricarica la pagina oppure esegui nuovamente l’accesso.</div>';}
    if(!token){fail();return;}
    try{
      const r=await fetch(BASE+'?t='+encodeURIComponent(token),{cache:'no-store'});
      let h=await r.text();
      if(!r.ok||!/^\s*<!doctype html/i.test(h)) throw new Error('invalid portal response');
      h=h.replace("history.replaceState({},'',location.pathname);","try{history.replaceState({},'',location.pathname)}catch(e){};");
      h=h.split("fetch(location.pathname+'?api=1&t='+encodeURIComponent(TOKEN)").join("fetch('"+BASE+"?api=1&t='+encodeURIComponent(TOKEN)");
      frame.onload=function(){state.style.display='none';frame.style.display='block';};
      frame.srcdoc=h;
    }catch(e){fail();}
  })();
  </script>
</body>
</html>
