name: Diagnosi blocco login 19 settembre
on:
  push:
    branches: [fix/login-render-loop-20260919, main]
    paths:
      - '.github/workflows/login-render-loop-20260919.yml'
      - 'scripts/fix_client_profile_render_loop.py'
      - 'scripts/apply_client_profile_save.py'
      - 'tests/login-render-loop.browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact production build
        run: |
          bash scripts/vercel-build-v13.sh
          bash scripts/vercel-finalize-20260914.sh
          node --check _site/client-profile-save.js
          grep -q 'OPTYKER_PROFILE_RENDER_LOOP_FIXED_20260919' _site/client-profile-save.js
          grep -q 'client-profile-save.js?v=20260919-profile-loop1' _site/index.html
          python - <<'PY'
          import shutil
          from pathlib import Path
          Path('/tmp/login-check').mkdir(exist_ok=True)
          shutil.make_archive('/tmp/login-check/built','zip','_site')
          PY
      - name: Browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Native-browser login regression
        run: |
          python -m http.server 8766 --directory _site >/tmp/login-server.log 2>&1 &
          node tests/login-render-loop.browser.cjs
      - name: Verify published login without logging in
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import urllib.request,time
          for n in range(30):
              html=urllib.request.urlopen('https://www.optyker.it/?login-release=20260919-profile-loop1-'+str(n),timeout=20).read().decode()
              if 'client-profile-save.js?v=20260919-profile-loop1' in html: break
              if n==29: raise SystemExit('Public login not updated')
              time.sleep(4)
          asset=urllib.request.urlopen('https://www.optyker.it/client-profile-save.js?v=20260919-profile-loop1',timeout=20).read().decode()
          assert 'OPTYKER_PROFILE_RENDER_LOOP_FIXED_20260919' in asset
          print('LIVE LOGIN ASSET VERIFIED 20260919-profile-loop1')
          PY
          LIVE_LOGIN=1 LOGIN_URL='https://www.optyker.it/?login-check=20260919-profile-loop1' LOGIN_OUTPUT=/tmp/login-check/live node tests/login-render-loop.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-render-regression
          path: /tmp/login-check/
          retention-days: 2
