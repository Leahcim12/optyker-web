name: Verifica Chat Cassa Documenti live

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Pubblica Optyker']
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verifica versione e hash degli asset pubblici
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__(); self.assets={}; self.enabled=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='html': self.enabled=a.get('data-ops')=='services'
                  if a.get('id') in ('optykerServicesCss','optykerServicesJs'):
                      self.assets[a['id']]=a.get('href',a.get('src',''))
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Optyker-Services-Check/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.read(4000000)
          def check(base):
              result={'base':base,'ok':False}
              for attempt in range(10):
                  try:
                      manifest=json.loads(get(base+'services-version.json'))
                      if manifest.get('commit')!=os.environ['EXPECTED_COMMIT']:
                          raise ValueError('Public release does not yet match expected commit')
                      parser=Tags();parser.feed(get(base).decode('utf-8'))
                      if not parser.enabled or len(parser.assets)!=2:
                          raise ValueError('Missing design marker or asset tags')
                      checks={}
                      for tag,relative in parser.assets.items():
                          url=urljoin(base,relative)
                          data=get(url)
                          name=url.split('/')[-1].split('?')[0]
                          digest=hashlib.sha256(data).hexdigest()
                          if digest!=manifest['assets'][name]:
                              raise ValueError('Asset hash mismatch: '+name)
                          checks[name]={'http':200,'bytes':len(data),'sha256':digest}
                      return {'base':base,'ok':True,'commit':manifest['commit'],'version':manifest['version'],'assets':checks}
                  except Exception as e:
                      result['error']=str(e)
                      if attempt<9: time.sleep(6)
              return result
          with ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(check,['https://www.optyker.it/','https://leahcim12.github.io/optyker-web/']))
          text=json.dumps(results,indent=2)
          print('OPTYKER_SERVICES_LIVE_REPORT\n'+text)
          Path('optyker-services-live.json').write_text(text)
          if not all(x['ok'] for x in results): raise SystemExit('Public release verification failed')
          PY
      - name: Conserva verifica pubblicazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optyker-services-live
          path: optyker-services-live.json
          retention-days: 7
