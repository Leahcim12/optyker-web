name: Verifica Visite senza scheda, DDT modificabili e stampa iPad
on:
  push:
    branches: [visite-senza-scheda-ddt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the exact Vercel artifact
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 -m py_compile scripts/apply_ddt_edit_20261126.py scripts/apply_report_20261014.py
          node --check optyker-report.js
          node --check ddt-edit.js
          bash scripts/vercel-build-20261013.sh
      - name: Print code of the real page (diagnostica, nessun dato)
        run: |
          python3 - <<'PY2'
          import re
          html = open('_site/index.html', encoding='utf-8').read()
          print('LENGTH', len(html))
          calls = [m.start() for m in re.finditer(r'printHtmlDocument\(', html)]
          print('##### chiamate printHtmlDocument:', len(calls))
          for i in calls:
              print('---', i, html[max(0, i - 260):i + 60].replace('\n', ' '))
          for fn in ['function indicationsUsePrintHtml', 'function prescriptionPrintHtml', 'function hearingPrintHtml', 'function reportHtmlFromData',
                     'function printHearing(', 'function printHearingImage(', 'function printReport(']:
              i = html.find(fn)
              print('\n#####', fn, i)
              if i >= 0:
                  j = html.find('\nfunction ', i + 20)
                  body = html[i:j if j > 0 else i + 6000]
                  print('lunghezza', len(body), 'script:', body.count('<script'), 'canvas:', body.count('<canvas'), 'toDataURL:', body.count('toDataURL'))
                  print(body[:2500])
          for needle in ['optykerIosPrintJs', 'optykerDdtEditJs', 'OPTYKER_DDT_EDIT_20261126', 'optyker-report.js?v=']:
              print('#####', needle, html.count(needle))
          PY2
