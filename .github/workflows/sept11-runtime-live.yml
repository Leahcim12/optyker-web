name: Verifica correzione R2 nella pagina pubblicata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sept11-runtime-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for real published-page checks
        run: |
          npm install --prefix /tmp/browser playwright@1.55.0
          /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Wait for this exact release on all public entry points
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import urllib.request,hashlib,json,time,os,re
          Path('runtime-diagnosis').mkdir(exist_ok=True)
          expected=os.environ['GITHUB_SHA']
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Optyker-R2-runtime-check/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r:return r.read(4000000)
          def check(base):
              result={'base':base,'ok':False}
              for attempt in range(35):
                  try:
                      m=json.loads(get(base+'sept11-version.json?check='+expected))
                      assert m.get('runtime_revision')=='20260911-r2','Previous runtime revision'
                      assert m['commit']==expected,'Previous source commit'
                      checked={}
                      for filename in m['assets']:
                          raw=get(base+filename+'?check='+expected)
                          assert hashlib.sha256(raw).hexdigest()==m['assets'][filename],'Asset hash differs: '+filename
                          checked[filename]=m['assets'][filename]
                      for alias in ('','gestionale-v2/','gestionale-v3/'):
                          html=get(base+alias+'?check='+expected).decode('utf8')
                          assert 'OPTYKER_RUNTIME_FIX_20260911_R2' in html
                          assert re.search(r'warehouse\.[0-9a-f]{12}\.js',html)
                          assert re.search(r'optyker-sept11\.[0-9a-f]{12}\.css',html)
                      return {'base':base,'ok':True,'commit':expected,'runtime_revision':m['runtime_revision'],'assets':checked}
                  except Exception as e:
                      result['error']=str(e)
                      if attempt<34:time.sleep(5)
              return result
          with ThreadPoolExecutor(max_workers=3) as p:
              results=list(p.map(check,['https://optyker.it/','https://www.optyker.it/','https://leahcim12.github.io/optyker-web/']))
          Path('runtime-diagnosis/deployment.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          assert all(r['ok'] for r in results),'Publication not fully verified'
          PY
      - name: Test real public UI with synthetic business APIs and no real writes
        env:
          NODE_PATH: /tmp/browser/node_modules
          OPTYKER_EXPECT_FIXED: '1'
        run: node tests/sept11-runtime-diagnosis.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optyker-r2-live-verification
          path: runtime-diagnosis/
          retention-days: 7
