name: Apply client chat tab

on:
  push:
    branches: [main]
    paths:
      - '.apply-client-chat-tab-20260825.txt'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Applica patch Optyker
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(curl -sS --retry 2 --retry-delay 1 'https://whgziwaegjzqsgcntesr.supabase.co/functions/v1/optyker-client-chat-tab-patch')"
          echo "$OUT"
          echo "$OUT" | grep -q '"ok":true'
          echo "$OUT" | grep -q '"marker":1\|"already":true'
