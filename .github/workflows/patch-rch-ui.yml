name: Patch RCH manual REG UI

on:
  push:
    paths:
      - '.github/workflows/patch-rch-ui.yml'
      - 'scripts/patch_manual_reg_production.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch production files
        run: python scripts/patch_manual_reg_production.py

      - name: Verify patch
        run: |
          grep -q "2.1-manual-reg" scripts/vercel-build-v13.sh
          grep -q "restore_reg" .github/workflows/pages.yml
          grep -q "rch-cloud-relay.js?v=20260916-manualreg2" index.html

      - name: Commit production patch
        run: |
          if git diff --quiet -- index.html scripts/vercel-build-v13.sh .github/workflows/pages.yml; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "optyker-bot"
          git config user.email "optyker-bot@users.noreply.github.com"
          git add index.html scripts/vercel-build-v13.sh .github/workflows/pages.yml
          git commit -m "Publish manual RCH REG control"
          git push
