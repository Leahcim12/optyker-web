name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara e verifica Optyker
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/vercel-build-v13.sh

      - name: Ripara inserimento appuntamenti Agenda
        run: |
          python scripts/patch_agenda_auto_studio_20260915.py
          python scripts/patch_agenda_staff_rules_20260915.py
          python scripts/check_desktop_html.py
          grep -q "OPTYKER_AGENDA_AUTO_STUDIO_20260915" _site/index.html
          grep -q "autoStudio" _site/index.html
          grep -q "OPTYKER_AGENDA_STAFF_RULES_20260915" _site/index.html
          grep -q "oaPrivateNotes" _site/index.html
          grep -q "oaV10ForceOccupied" _site/index.html
          grep -q "Fiera / trasferta" _site/index.html
          grep -q "almeno email oppure telefono" _site/index.html

      - name: Carrello cliente e ordini Laboratorio
        run: |
          python scripts/apply_cash_pos5.py
          python scripts/prepare_order_cart_lab_20260915.py
          python scripts/patch_order_cart_lab_20260915.py
          python scripts/patch_eyewear_order_button_visible_20260915.py
          node --check _site/cash-register.js
          node --check _site/cash-pos5.js
          node --check _site/optyker-operations.js
          python scripts/check_desktop_html.py
          grep -q "__OPTYKER_CLIENT_CART_PERSISTENCE_V1__" _site/cash-register.js
          grep -q "OPTYKER_ORDER_CART_LAB_20260915" _site/index.html
          grep -q "Pronto per la consegna" _site/index.html
          grep -q "optykerCashPos5Js" _site/index.html

      - name: Pubblica connettore RCH e relay iPad
        run: |
          mkdir -p _site/rch-connector
          cp -R rch-connector/. _site/rch-connector/
          cp rch-cloud-relay.js _site/rch-cloud-relay.js
          test -s _site/rch-connector/Installa-RCH-Optyker.bat
          test -s _site/rch-connector/Installa-RCH-Optyker.ps1
          test -s _site/rch-connector/rch-optyker-connector.ps1
          test -s _site/rch-connector/rch-optyker-cloud-worker.ps1
          test -s _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "2.1-manual-reg" _site/rch-connector/rch-optyker-cloud-worker.ps1
          grep -q "restore_reg" _site/rch-connector/rch-optyker-cloud-worker.ps1
          grep -q "=C1" _site/rch-connector/rch-optyker-cloud-worker.ps1
          grep -q "Porta RCH in REG" _site/rch-cloud-relay.js
          grep -q "__OPTYKER_RCH_CLOUD_RELAY__" _site/rch-cloud-relay.js
          grep -q "rch-cloud-relay.js?v=20260916-manualreg2" _site/index.html
          pwsh -NoLogo -NoProfile -Command '$files=@("_site/rch-connector/Installa-RCH-Optyker.ps1","_site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1","_site/rch-connector/rch-optyker-cloud-worker.ps1"); foreach($f in $files){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){Write-Host "Parser errors in $f" -ForegroundColor Red;$errors|ForEach-Object{Write-Host $_.Message -ForegroundColor Red};exit 1}}; Write-Host "RCH PowerShell syntax OK"'

      - name: Ripristina interazioni Optyker
        run: |
          node --check optyker-interaction-guard.js
          cp optyker-interaction-guard.js _site/optyker-interaction-guard.js
          cp optyker-interaction-guard.js _site/gestionale-v2/optyker-interaction-guard.js
          cp optyker-interaction-guard.js _site/gestionale-v3/optyker-interaction-guard.js
          python - <<'PY'
          from pathlib import Path
          tag='<script src="optyker-interaction-guard.js?v=20260914-unlock1"></script>'
          for rel in ('index.html','gestionale-v2/index.html','gestionale-v3/index.html'):
              p=Path('_site')/rel
              text=p.read_text(encoding='utf-8')
              if tag not in text:
                  i=text.lower().rfind('</body>')
                  if i < 0:
                      raise SystemExit('Closing body not found in '+rel)
                  text=text[:i]+tag+'\n'+text[i:]
                  p.write_text(text,encoding='utf-8')
          PY
          grep -q "optyker-interaction-guard.js?v=20260914-unlock1" _site/index.html
          grep -q "__OPTYKER_INTERACTION_GUARD__" _site/optyker-interaction-guard.js

      - name: Verifica Scheda Occhiali aggiornata
        run: |
          grep -q "20260906-eyewear-flow9" _site/index.html
          grep -q "20260906-eyewear-discounts-v10" _site/index.html
          grep -q "20260906-eyewear-ui-fix-v11" _site/index.html
          grep -q "20260907-eyewear-flow-v12-stable1" _site/index.html
          grep -q "20260907-eyewear-summary-v13" _site/index.html
          grep -q "Sportive" _site/index.html
          grep -q "€ 25 a lente" _site/index.html
          grep -q "solo monofocali" _site/index.html
          grep -q "optyker-eyewear-api-v6" _site/index.html
          grep -q "Lente DX" _site/index.html
          grep -q "Lente SX" _site/index.html
          grep -q "Indice lente" _site/index.html
          grep -q "Base · inclusa" _site/index.html

      - name: Selezione voci da pagare nel carrello
        run: |
          python scripts/apply_cash_cart_selection.py
          node --check _site/cash-register.js
          node --test tests/cash-cart-selection.test.mjs

      - name: Parametri Occhiali e annullamento ordini
        run: |
          python scripts/apply_eyewear_order_parameters.py
          node --check _site/order-sheet-actions.js
          node --test tests/eyewear-order-parameters.test.mjs

      - name: Annullamento unico TS e RCH
        run: |
          python scripts/apply_unified_fiscal_void.py
          node --check _site/unified-fiscal-void.js
          node --check _site/rch-cloud-relay.js
          node --test tests/unified-fiscal-void.test.mjs

      - name: Carica sito GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
