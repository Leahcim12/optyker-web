name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara e verifica Optyker
        run: |
          mkdir -p _site _jscheck
          curl -fL --retry 3 --retry-delay 2 "https://whgziwaegjzqsgcntesr.supabase.co/storage/v1/object/public/optyker-web/index.html?v=${GITHUB_SHA}" -o _site/index.html
          test -s _site/index.html
          python scripts/patch_optyker.py
          python scripts/remove_login_store_user.py
          python scripts/patch_profile.py
          python scripts/patch_client_chat_tab.py
          python scripts/patch_whatsapp_channel.py
          python scripts/patch_appointments.py
          python scripts/patch_whatsapp_qr_connect.py
          python scripts/patch_whatsapp_qr_meta_fix.py
          mkdir -p _site/staff-embed
          cp staff-embed/index.html _site/staff-embed/index.html
          python scripts/patch_staff_whatsapp.py
          test -s _site/staff-embed/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('_site/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          for i,code in enumerate(scripts):
              if code.strip(): Path(f'_jscheck/{i}.js').write_text(code,encoding='utf-8')
          staff=Path('_site/staff-embed/index.html').read_text(encoding='utf-8')
          staff_scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',staff,re.I)
          for i,code in enumerate(staff_scripts):
              if code.strip(): Path(f'_jscheck/staff-{i}.js').write_text(code,encoding='utf-8')
          if 'OPTYKER_CUSTOMER_CHAT_UI_V3' not in s or 'id="navChat"' not in s:
              raise SystemExit('Chat Optyker non presente nella build')
          if 'OPTYKER_TOP_DASHBOARD_NEXT_TO_NEW_CLIENT_V3' not in s:
              raise SystemExit('Pulsante Dashboard non presente nella build')
          if 'OPTYKER_OPERATOR_PROFILE_V1' not in s or 'optykerTopProfileBtn' not in s:
              raise SystemExit('Profilo operatore non presente nella build')
          if 'OPTYKER_CLIENT_CHAT_TAB_V1' not in s or 'id="clientChatSection"' not in s:
              raise SystemExit('Chat nella scheda cliente non presente nella build')
          if 'OPTYKER_WHATSAPP_CHANNEL_V2' not in s or 'id="navSettings"' not in s or 'id="optykerSettingsPanel"' not in s:
              raise SystemExit('WhatsApp integrato / Impostazioni non presente nella build')
          if 'OPTYKER_APPOINTMENTS_UI_V1' not in s or 'id="navAppointments"' not in s or 'id="optykerAppointmentsPanel"' not in s:
              raise SystemExit('Agenda appuntamenti non presente nella build')
          if 'OPTYKER_WHATSAPP_QR_CONNECT_V1' not in s or 'optykerWaQrStart' not in s:
              raise SystemExit('Collegamento WhatsApp QR non presente nella build')
          if 'OPTYKER_WHATSAPP_QR_META_FIX_V2' not in s or "version:'v25.0'" not in s or "sessionInfoVersion:'3'" not in s:
              raise SystemExit('Fix Meta Embedded Signup non presente nella build')
          if 'optyker-shopify-staff-embed' not in staff or 'OPTYKER_STAFF_STATIC_UI_V2' not in staff:
              raise SystemExit('Renderer staff Shopify standalone non presente nella build')
          if 'OPTYKER_STAFF_WHATSAPP_V1' not in staff or 'optyker-shopify-staff-whatsapp' not in staff or 'id="channelWa"' not in staff:
              raise SystemExit('Chat WhatsApp Shopify non presente nella build')
          print('Script inline:',len(scripts),'staff scripts:',len(staff_scripts),'bytes:',len(s),'staff bytes:',len(staff))
          PY
          for f in _jscheck/*.js; do node --check "$f"; done
          touch _site/.nojekyll

      - name: Abilita e configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
