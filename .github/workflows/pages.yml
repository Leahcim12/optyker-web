name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara e verifica Optyker
        run: |
          mkdir -p _site _jscheck
          curl -fL --retry 3 --retry-delay 2 "https://whgziwaegjzqsgcntesr.supabase.co/storage/v1/object/public/optyker-web/index.html?v=${GITHUB_SHA}" -o _site/index.html
          test -s _site/index.html
          python scripts/patch_optyker.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('_site/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          for i,code in enumerate(scripts):
              if code.strip(): Path(f'_jscheck/{i}.js').write_text(code,encoding='utf-8')
          if 'OPTYKER_CUSTOMER_CHAT_UI_V3' not in s or 'id="navChat"' not in s:
              raise SystemExit('Chat Optyker non presente nella build')
          if 'OPTYKER_TOP_DASHBOARD_NEXT_TO_NEW_CLIENT_V3' not in s:
              raise SystemExit('Pulsante Dashboard non presente nella build')
          print('Script inline:',len(scripts),'bytes:',len(s))
          PY
          for f in _jscheck/*.js; do node --check "$f"; done
          touch _site/.nojekyll

      - name: Abilita e configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
