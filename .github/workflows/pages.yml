name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara e verifica Optyker
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/vercel-build-v13.sh

      - name: Pubblica connettore RCH e relay iPad
        run: |
          mkdir -p _site/rch-connector
          cp -R rch-connector/. _site/rch-connector/
          cp rch-cloud-relay.js _site/rch-cloud-relay.js
          sed -i 's#https://www.optyker.it/rch-connector/rch-optyker-cloud-worker.ps1#https://leahcim12.github.io/optyker-web/rch-connector/rch-optyker-cloud-worker.ps1#g' _site/rch-connector/Installa-RCH-Optyker.ps1
          sed -i 's#https://www.optyker.it/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud1#https://leahcim12.github.io/optyker-web/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud2#g' _site/rch-connector/Installa-RCH-Optyker.bat
          sed -i 's#https://www.optyker.it/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud1#https://leahcim12.github.io/optyker-web/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud2#g' _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          test -s _site/rch-connector/Installa-RCH-Optyker.bat
          test -s _site/rch-connector/Installa-RCH-Optyker.ps1
          test -s _site/rch-connector/rch-optyker-connector.ps1
          test -s _site/rch-connector/rch-optyker-cloud-worker.ps1
          test -s _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "1.9-cloud-relay" _site/rch-connector/rch-optyker-cloud-worker.ps1
          grep -q "Set-OptykerRchCloudAutostart" _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "leahcim12.github.io/optyker-web/rch-connector/rch-optyker-cloud-worker.ps1" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "leahcim12.github.io/optyker-web/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud2" _site/rch-connector/Installa-RCH-Optyker.bat
          grep -q "leahcim12.github.io/optyker-web/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud2" _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "cloud-relay" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "__OPTYKER_RCH_CLOUD_RELAY__" _site/rch-cloud-relay.js

      - name: Verifica Scheda Occhiali aggiornata
        run: |
          grep -q "20260906-eyewear-flow9" _site/index.html
          grep -q "20260906-eyewear-discounts-v10" _site/index.html
          grep -q "20260906-eyewear-ui-fix-v11" _site/index.html
          grep -q "20260907-eyewear-flow-v12-stable1" _site/index.html
          grep -q "20260907-eyewear-summary-v13" _site/index.html
          grep -q "Sportive" _site/index.html
          grep -q "€ 25 a lente" _site/index.html
          grep -q "solo monofocali" _site/index.html
          grep -q "optyker-eyewear-api-v6" _site/index.html
          grep -q "Lente DX" _site/index.html
          grep -q "Lente SX" _site/index.html
          grep -q "Indice lente" _site/index.html
          grep -q "Base · inclusa" _site/index.html

      - name: Carica sito GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4