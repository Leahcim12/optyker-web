name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara e verifica Optyker
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/vercel-build-v13.sh

      - name: Pubblica connettore RCH e relay iPad
        run: |
          mkdir -p _site/rch-connector
          cp -R rch-connector/. _site/rch-connector/
          cp rch-cloud-relay.js _site/rch-cloud-relay.js
          test -s _site/rch-connector/Installa-RCH-Optyker.bat
          test -s _site/rch-connector/Installa-RCH-Optyker.ps1
          test -s _site/rch-connector/Installa-iPad-Optyker-RCH.bat
          test -s _site/rch-connector/Installa-iPad-Optyker-RCH.ps1
          test -s _site/rch-connector/rch-optyker-connector.ps1
          test -s _site/rch-connector/rch-optyker-cloud-worker.ps1
          test -s _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "2.0-cloud-relay-http" _site/rch-connector/rch-optyker-cloud-worker.ps1
          grep -q "20260914-ipad2" _site/rch-connector/Installa-iPad-Optyker-RCH.bat
          grep -q "Polling cloud confermato" _site/rch-connector/Installa-iPad-Optyker-RCH.ps1
          grep -q "Set-OptykerRchCloudAutostart" _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "System.Management.Automation.Language.Parser" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "https://leahcim12.github.io/optyker-web/rch-connector" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "rch-optyker-cloud-worker.ps1?v=20260914-cloud4" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "rch-optyker-connector.ps1?v=20260914-cloud4" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "Attiva-Avvio-Automatico-RCH.ps1?v=20260914-cloud4" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "leahcim12.github.io/optyker-web/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud4" _site/rch-connector/Installa-RCH-Optyker.bat
          grep -q "leahcim12.github.io/optyker-web/rch-connector/Installa-RCH-Optyker.ps1?v=20260914-cloud4" _site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1
          grep -q "Il connettore fiscale attuale NON verra modificato" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "ERRORE INSTALLAZIONE OPTYKER RCH" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "Installazione non completata" _site/rch-connector/Installa-RCH-Optyker.bat
          grep -q "cloud-relay" _site/rch-connector/Installa-RCH-Optyker.ps1
          grep -q "__OPTYKER_RCH_CLOUD_RELAY__" _site/rch-cloud-relay.js
          pwsh -NoLogo -NoProfile -Command '$files=@("_site/rch-connector/Installa-RCH-Optyker.ps1","_site/rch-connector/Installa-iPad-Optyker-RCH.ps1","_site/rch-connector/Attiva-Avvio-Automatico-RCH.ps1","_site/rch-connector/rch-optyker-cloud-worker.ps1"); foreach($f in $files){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){Write-Host "Parser errors in $f" -ForegroundColor Red;$errors|ForEach-Object{Write-Host $_.Message -ForegroundColor Red};exit 1}}; Write-Host "RCH PowerShell syntax OK"'

      - name: Ripristina interazioni Optyker
        run: |
          node --check optyker-interaction-guard.js
          cp optyker-interaction-guard.js _site/optyker-interaction-guard.js
          cp optyker-interaction-guard.js _site/gestionale-v2/optyker-interaction-guard.js
          cp optyker-interaction-guard.js _site/gestionale-v3/optyker-interaction-guard.js
          python - <<'PY'
          from pathlib import Path
          tag='<script src="optyker-interaction-guard.js?v=20260914-unlock1"></script>'
          for rel in ('index.html','gestionale-v2/index.html','gestionale-v3/index.html'):
              p=Path('_site')/rel
              text=p.read_text(encoding='utf-8')
              if tag not in text:
                  i=text.lower().rfind('</body>')
                  if i < 0:
                      raise SystemExit('Closing body not found in '+rel)
                  text=text[:i]+tag+'\n'+text[i:]
                  p.write_text(text,encoding='utf-8')
          PY
          grep -q "optyker-interaction-guard.js?v=20260914-unlock1" _site/index.html
          grep -q "__OPTYKER_INTERACTION_GUARD__" _site/optyker-interaction-guard.js

      - name: Verifica Scheda Occhiali aggiornata
        run: |
          grep -q "20260906-eyewear-flow9" _site/index.html
          grep -q "20260906-eyewear-discounts-v10" _site/index.html
          grep -q "20260906-eyewear-ui-fix-v11" _site/index.html
          grep -q "20260907-eyewear-flow-v12-stable1" _site/index.html
          grep -q "20260907-eyewear-summary-v13" _site/index.html
          grep -q "Sportive" _site/index.html
          grep -q "€ 25 a lente" _site/index.html
          grep -q "solo monofocali" _site/index.html
          grep -q "optyker-eyewear-api-v6" _site/index.html
          grep -q "Lente DX" _site/index.html
          grep -q "Lente SX" _site/index.html
          grep -q "Indice lente" _site/index.html
          grep -q "Base · inclusa" _site/index.html

      - name: Carica sito GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
