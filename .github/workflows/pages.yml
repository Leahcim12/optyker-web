name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara e verifica Optyker
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/vercel-build.sh

      - name: Verifica ultime modifiche Scheda Occhiali
        run: |
          grep -q "20260906-eyewear-flow7" _site/index.html
          grep -q "1.74" _site/index.html
          grep -q "Bi-asferica" _site/index.html
          grep -q "Garanzia Silver" _site/index.html
          grep -q "Garanzia Gold" _site/index.html

      - name: Carica sito GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
