name: Pubblica Optyker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara e verifica Optyker
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/vercel-build-v10.sh

      - name: Verifica sconti Scheda Occhiali
        run: |
          grep -q "20260906-eyewear-flow9" _site/index.html
          grep -q "20260906-eyewear-discounts-v10" _site/index.html
          grep -q "SCELTA DELLA LENTE DX" _site/index.html
          grep -q "SCELTA DELLA LENTE SX" _site/index.html
          grep -q "STUDENTIBLU" _site/index.html
          grep -q "OCCHIALI15" _site/index.html
          grep -q "MONTATURA30" _site/index.html
          grep -q "LENTI15" _site/index.html
          grep -q "VICINO" _site/index.html
          grep -q "VICINOHARD" _site/index.html
          grep -q "VICINOHMC" _site/index.html
          grep -q "optyker-eyewear-api-v5" _site/index.html

      - name: Carica sito GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
