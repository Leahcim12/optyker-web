name: Riallinea build occhiali iPhone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-iphone-eyewear-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Riallinea build
        run: python scripts/fix_iphone_eyewear_build_check.py
      - name: Salva correzione e rimuovi fixer temporaneo
        run: |
          rm -f scripts/fix_iphone_eyewear_build_check.py .github/workflows/fix-iphone-eyewear-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iphone-app-v13/index.html iphone-app-v13/sw.js scripts/patch_iphone_customer_eyewear_v1.py scripts/fix_iphone_eyewear_build_check.py .github/workflows/fix-iphone-eyewear-build.yml
          git commit -m "Allinea build occhiali iPhone ai controlli Pages"
          git push
