name: Verifica ricalcolo Cassa
on:
  push:
    branches: [fix/cash-quote-pending-20260919, main]
    paths:
      - 'cash-ovc-pricing.js'
      - 'scripts/apply_cash_cart_selection.py'
      - 'scripts/apply_eyewear_order_parameters.py'
      - 'tests/cash-quote-recovery.browser.cjs'
      - '.github/workflows/cash-quote-pending-20260919.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact production
        run: |
          mkdir -p /tmp/quote-check
          git archive --format=zip HEAD -o /tmp/quote-check/source.zip
          bash scripts/vercel-build-v13.sh
          bash scripts/vercel-finalize-20260914.sh
          python -c "import shutil;shutil.make_archive('/tmp/quote-check/built','zip','_site')"
          node --check _site/cash-register.js
          grep -F "OPTYKER_CASH_QUOTE_VERSION='20260919-quote1'" _site/cash-register.js
          grep -F 'cash-register.js?v=20260916-selection3-quote1' _site/index.html
      - name: Browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Quotation, login and cashier without physical printer
        run: |
          python -m http.server 8766 --directory _site >/tmp/quote-server.log 2>&1 &
          node tests/cash-quote-recovery.browser.cjs
          node tests/login-render-loop.browser.cjs
          node tests/cash-opening.browser.cjs
      - name: Verify exact published static assets only
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,time,hashlib
          expected=Path('_site/cash-register.js').read_bytes()
          for n in range(30):
              try:
                  for path in ('/','/gestionale-v2/','/gestionale-v3/'):
                      html=urllib.request.urlopen('https://www.optyker.it'+path+'?quote-check='+str(int(time.time())),timeout=15).read().decode()
                      assert 'cash-register.js?v=20260916-selection3-quote1' in html
                  actual=urllib.request.urlopen('https://www.optyker.it/cash-register.js?quote-check='+str(int(time.time())),timeout=15).read()
                  assert actual==expected
                  print('LIVE QUOTATION RECOVERY VERIFIED',hashlib.sha256(actual).hexdigest())
                  break
              except Exception as e:
                  if n==29: raise
                  print('Awaiting publication',str(e));time.sleep(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash-quote-check
          path: /tmp/quote-check/
          retention-days: 2
