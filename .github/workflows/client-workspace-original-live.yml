name: Verifica anagrafica originale pubblicata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/client-workspace-original-live.yml']
  workflow_run:
    workflows: ['Pubblica Optyker']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public static assets only
        run: |
          python - <<'PY'
          import urllib.request, time, hashlib
          host = 'https://www.optyker.it'
          targets = {
              '/': ['optykerClientWorkspaceOriginalJs', 'optykerClientWorkspaceOriginalCss'],
              '/client-workspace-original.js': ['20260919-original1', 'OPTYKER_CLIENT_WORKSPACE_ORIGINAL'],
              '/client-workspace-original.css': ['20260919-original1', 'optykerOriginalClients'],
          }
          for attempt in range(24):
              try:
                  results = []
                  for path, markers in targets.items():
                      url = host + path + '?client-workspace-check=' + str(int(time.time()))
                      req = urllib.request.Request(url, headers={'User-Agent':'Optyker-Release-Verification', 'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read().decode('utf-8')
                          assert response.status == 200
                      for marker in markers:
                          assert marker in body, 'Missing ' + marker + ' in ' + path
                      results.append((path, len(body), hashlib.sha256(body.encode()).hexdigest()))
                  for result in results:
                      print('LIVE VERIFIED', *result)
                  break
              except Exception as exc:
                  print('Awaiting production release:', type(exc).__name__, str(exc))
                  if attempt == 23:
                      raise
                  time.sleep(4)
          PY
