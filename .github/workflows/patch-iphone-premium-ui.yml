name: Restyling premium app iPhone Optyker

on:
  push:
    branches: [main]
    paths:
      - 'iphone-app-v13/premium-ui-v1.css'
      - 'iphone-app-v13/premium-ui-v1.js'
      - 'iphone-app-v13/reference-interactions-v1.css'
      - 'iphone-app-v13/reference-interactions-v1.js'
      - 'iphone-app-v13/shop-nav-v2.css'
      - 'iphone-app-v13/shop-nav-v2.js'
      - 'booking/premium-ui-v1.css'
      - 'scripts/patch_iphone_premium_ui_v1.py'
      - 'scripts/test_iphone_shop_logo.cjs'
      - '.github/workflows/patch-iphone-premium-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica restyling premium iPhone
        run: python scripts/patch_iphone_premium_ui_v1.py
      - name: Verifica JavaScript premium
        run: |
          node --check iphone-app-v13/premium-ui-v1.js
          node --check iphone-app-v13/reference-interactions-v1.js
          node --check iphone-app-v13/shop-nav-v2.js
      - name: Verifica logo Shop e navigazione
        run: node scripts/test_iphone_shop_logo.cjs
      - name: Verifica disponibilita logo originale
        run: |
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 30 \
            'https://cdn.shopify.com/s/files/1/0917/4289/6503/files/visual-care-logo-app-original.png?v=1787903859' \
            --output /tmp/optyker-official-logo.png
          python - <<'PY'
          from pathlib import Path
          import struct
          data = Path('/tmp/optyker-official-logo.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Il logo deve essere un PNG valido'
          width, height = struct.unpack('>II', data[16:24])
          assert width > 0 and height > 0, 'Il logo deve avere dimensioni valide'
          print(f'Logo OVC originale disponibile: {width}x{height} px')
          PY
      - name: Salva layout aggiornato
        run: |
          if git diff --quiet -- iphone-app-v13/index.html booking/index.html; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iphone-app-v13/index.html booking/index.html
          git commit -m "Aggiorna layout premium app iPhone Optyker"
          git push
