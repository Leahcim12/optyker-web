name: Verifica schede e preventivi nella pagina pubblicata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/client-sheet-actions-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix /tmp/browser playwright@1.55.0
          /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check exact published assets and desktop entry points
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import urllib.request,hashlib,json,time,os
          out=Path('sheet-actions-check');out.mkdir(exist_ok=True)
          expected=os.environ['GITHUB_SHA']
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Optyker-Client-Sheet-Check/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r:return r.read(4000000)
          def check(base):
              result={'base':base,'ok':False}
              for attempt in range(35):
                  try:
                      m=json.loads(get(base+'client-sheets-version.json?check='+expected))
                      assert m['version']=='20260911-client-sheets1','Previous feature version'
                      assert m['commit']==expected,'Previous source commit'
                      assets={}
                      for filename,digest in m['assets'].items():
                          raw=get(base+filename+'?check='+expected)
                          assert hashlib.sha256(raw).hexdigest()==digest,'Asset differs: '+filename
                          assets[filename]=digest
                      for alias in ('','gestionale-v2/','gestionale-v3/'):
                          html=get(base+alias+'?check='+expected).decode('utf8')
                          assert 'id="optykerClientSheetActionsJs"' in html and 'id="optykerClientSheetActionsCss"' in html
                          assert all(filename in html for filename in m['assets'])
                      return {'base':base,'ok':True,'commit':expected,'assets':assets}
                  except Exception as e:
                      result['error']=str(e)
                      if attempt<34:time.sleep(5)
              return result
          with ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(check,['https://optyker.it/','https://www.optyker.it/','https://leahcim12.github.io/optyker-web/']))
          (out/'deployment.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          assert all(r['ok'] for r in results),'Published version not fully verified'
          PY
      - name: Exercise real published UI with synthetic business APIs only
        env:
          NODE_PATH: /tmp/browser/node_modules
          OPTYKER_LIVE: '1'
        run: node tests/client-sheet-actions.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-sheet-actions-live-verification
          path: sheet-actions-check/
          retention-days: 7
