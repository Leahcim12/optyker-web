name: Verifica certificato materiali pubblicato
on:
  push:
    branches: [main]
    paths: ['.github/workflows/materials-certificate-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix /tmp/browser playwright@1.55.0
          /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check exact release on public entry points
        run: |
          mkdir -p materials-check
          python3 - <<'PY'
          import urllib.request,json,hashlib,time,os
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          expected=os.environ['GITHUB_SHA']
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Optyker-Materials-Certificate-Check'})
              with urllib.request.urlopen(req,timeout=15) as r:return r.read(4000000)
          def check(base):
              error=''
              for attempt in range(30):
                  try:
                      m=json.loads(get(base+'materials-certificate-version.json?check='+expected))
                      assert m['version']=='20260911-materials1' and m['commit']==expected,'Previous release'
                      for name,digest in m['assets'].items():
                          assert hashlib.sha256(get(base+name)).hexdigest()==digest,'Asset mismatch: '+name
                      for entry in ('','gestionale-v2/','gestionale-v3/'):
                          html=get(base+entry+'?check='+expected).decode('utf8')
                          assert 'id="optykerMaterialsCertificateJs"' in html and 'id="optykerMaterialsCertificateCss"' in html
                          assert all(name in html for name in m['assets'])
                      return {'base':base,'ok':True,'commit':m['commit'],'assets':m['assets']}
                  except Exception as e:
                      error=str(e)
                      if attempt<29:time.sleep(5)
              return {'base':base,'ok':False,'error':error}
          with ThreadPoolExecutor(max_workers=3) as p:
              result=list(p.map(check,['https://www.optyker.it/','https://optyker.it/','https://leahcim12.github.io/optyker-web/']))
          Path('materials-check/deployment.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert all(x['ok'] for x in result),'Published release not yet verified'
          PY
      - name: Test actual public UI with synthetic business APIs only
        env:
          NODE_PATH: /tmp/browser/node_modules
          OPTYKER_LIVE: '1'
        run: node tests/materials-certificate.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-certificate-live-check
          path: materials-check/
          retention-days: 7
