name: Patch sidebar order

on:
  push:
    paths:
      - .github/workflows/patch-sidebar.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Clienti below Dashboard
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); needle=\"    html=html.replace(/Diego Panseri/g,'Diego Pansieri');\"; patch=\"    html=html.replace('</body>','<script>(function(){function m(){var n=document.getElementById(\\\"moduleNav\\\"),d=document.getElementById(\\\"navDashboard\\\"),c=document.getElementById(\\\"navClients\\\");if(n&&d&&c&&d.nextElementSibling!==c)n.insertBefore(c,d.nextElementSibling)}if(document.readyState===\\\"loading\\\")document.addEventListener(\\\"DOMContentLoaded\\\",m);else m();setTimeout(m,100);setTimeout(m,700)})();<\\\\/script></body>');\"; p.write_text(s if 'navClients\\\");if(n&&d&&c' in s else s.replace(needle, needle+'\\n'+patch,1), encoding='utf-8')"
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Clienti below Dashboard"
          git push
