name: Mostra occhiali e garanzie nel profilo cliente iPhone

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_iphone_customer_eyewear_v1.py'
      - '.github/workflows/patch-iphone-customer-eyewear.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica vista occhiali cliente
        run: python scripts/patch_iphone_customer_eyewear_v1.py
      - name: Salva aggiornamento iPhone
        run: |
          if git diff --quiet -- iphone-app-v13/index.html iphone-app-v13/sw.js; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iphone-app-v13/index.html iphone-app-v13/sw.js
          git commit -m "Mostra montatura lenti e garanzia nel profilo cliente"
          git push
