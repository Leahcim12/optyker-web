name: Verifica Paese di nascita
on:
  push:
    branches: [main]
    paths:
      - 'client-birth-country.js'
      - 'scripts/apply_client_profile_save.py'
      - '.github/workflows/client-birth-country-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check birth country script syntax
        run: node --check client-birth-country.js
      - name: Run production build
        run: bash scripts/vercel-build-v13.sh && bash scripts/vercel-finalize-20260914.sh
      - name: Confirm visible birth country asset
        run: |
          grep -q 'id="optykerClientBirthCountryJs"' _site/index.html
          python3 - <<'PYTHON'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('scripts/apply_client_profile_save.py').read_text())
          version=next(n.value.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='VERSION' for t in n.targets))
          assert 'client-birth-country.js?v='+version in Path('_site/index.html').read_text()
          PYTHON
          grep -q 'Paese di nascita' _site/client-birth-country.js
          grep -q 'optykerBirthCountryMainInput' _site/client-birth-country.js
