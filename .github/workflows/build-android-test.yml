name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android-test.yml'

permissions:
  contents: write

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Generate Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build installable APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp mobile-app/android/app/build/outputs/apk/release/app-release.apk dist/OTTICA-VISUAL-CARE.apk
          ls -lh dist/OTTICA-VISUAL-CARE.apk

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test dist/OTTICA-VISUAL-CARE.apk \
            --prerelease \
            --title 'OTTICA VISUAL CARE - Android Release' \
            --notes 'APK Android release installabile e autonoma. JavaScript incluso nel pacchetto; non richiede Metro.'
