name: Admin cash production build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble Optyker production site
        run: bash scripts/vercel-build-v13.sh
      - name: Apply final production patches
        run: bash scripts/vercel-finalize-20260914.sh
      - name: Verify admin cash assets
        run: |
          test -f _site/admin-cash-closure.js
          test -f _site/admin-cash-closure.css
          test -f _site/admin-cash-today-controls.js
          test -f _site/admin-cash-today-controls.css
          test -f _site/admin-cash-version.json
          node --check _site/admin-cash-closure.js
          node --check _site/admin-cash-today-controls.js
          grep -q '__OPTYKER_ADMIN_CASH_CLOSURE_V2__' _site/admin-cash-closure.js
          grep -q '__OPTYKER_ADMIN_CASH_TODAY_CONTROLS__' _site/admin-cash-today-controls.js
          grep -q 'optykerAdminCashClosureJs' _site/index.html
          grep -q 'optykerAdminCashClosureCss' _site/index.html
          grep -q 'optykerAdminCashTodayJs' _site/index.html
          grep -q 'optykerAdminCashTodayCss' _site/index.html
          grep -q '20260916-admin-cash5' _site/admin-cash-version.json
          grep -q 'Amministratore · Ottica Visual Care' _site/index.html
          grep -q 'value="__optyker_admin__"' _site/index.html
          grep -q 'Chiusure cassa' _site/admin-cash-closure.js
          grep -q 'Fatture emesse' _site/billing-admin.js
          grep -q 'Fatture in entrata' _site/billing-admin.js
