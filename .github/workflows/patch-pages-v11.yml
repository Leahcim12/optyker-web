name: Collega Agenda V11 sicura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pages-v11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna pipeline Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          a='          python scripts/patch_appointments_v10_manage.py\n'
          b=a+'          python scripts/patch_appointments_v11_secure.py\n'
          if 'patch_appointments_v11_secure.py' not in s:
              if a not in s: raise SystemExit('anchor v10 mancante')
              s=s.replace(a,b,1)
          check="          if 'OPTYKER_APPOINTMENTS_UI_V10_MANAGE' not in s or 'id=\"oaManageModal\"' not in s or 'oaV10Save' not in s or 'oaV10Cancel' not in s:\n              raise SystemExit('Agenda V10 dettaglio / modifica / annullamento non presente nella build')\n"
          secure=check+"          if 'OPTYKER_APPOINTMENTS_UI_V11_SECURE' not in s or 'optyker-appointments-staff' not in s:\n              raise SystemExit('Agenda V11 salvataggio sicuro non presente nella build')\n"
          if 'Agenda V11 salvataggio sicuro' not in s:
              if check not in s: raise SystemExit('check v10 mancante')
              s=s.replace(check,secure,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pages.yml
          git diff --cached --quiet || git commit -m 'Usa salvataggio sicuro Agenda V11'
          git push