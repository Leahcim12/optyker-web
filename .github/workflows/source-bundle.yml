name: Pacchetto sorgenti per verifica
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: optyker-source
          path: source.zip
          retention-days: 1
