name: Android Play Bundle - OVC com package
on:
  push:
    branches: ['build/android-play-com-20261006']
    paths:
      - 'mobile-app/**'
      - 'scripts/*android_play*'
      - '.github/workflows/android-play-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-play-bundle-com-20261006
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare existing customer app, logo and Android 16 settings
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare_android_play_20260918.py
      - name: Install locked Expo SDK 57 dependencies
        working-directory: mobile-app
        run: |
          npm ci --include=dev
          npx expo install --check
          mkdir -p ../dist/android-play
          npm audit --json > ../dist/android-play/dependency-audit.json || true
      - name: Generate native Android project and disable debug signing for release
        working-directory: mobile-app
        run: |
          npx expo prebuild --platform android --clean --no-install
          cat >> android/app/build.gradle <<'GRADLE'
          // Play upload key is never available on this public build runner.
          android {
              buildTypes {
                  release {
                      signingConfig = null
                      debuggable = false
                  }
              }
          }
          GRADLE
          chmod +x android/gradlew
      - name: Build release Android App Bundle
        working-directory: mobile-app/android
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' --stacktrace
      - name: Validate actual bundle and collect reproducible sources
        run: |
          mkdir -p dist/android-play
          cp mobile-app/android/app/build/outputs/bundle/release/app-release.aab dist/android-play/ovc-release-unsigned.aab
          curl -fLsS --retry 2 --max-time 120 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o dist/android-play/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  dist/android-play/bundletool.jar' | sha256sum -c -
          java -jar dist/android-play/bundletool.jar validate --bundle=dist/android-play/ovc-release-unsigned.aab > dist/android-play/bundle-validation.txt
          java -jar dist/android-play/bundletool.jar dump manifest --bundle=dist/android-play/ovc-release-unsigned.aab --module=base > dist/android-play/manifest.xml
          java -jar dist/android-play/bundletool.jar dump config --bundle=dist/android-play/ovc-release-unsigned.aab > dist/android-play/bundle-config.json
          python scripts/verify_android_play_20260918.py
          cp mobile-app/assets/play-icon.png dist/android-play/icon-1024.png
      - name: Split validated bundle into downloads smaller than 32 MiB
        run: |
          python - <<'PY_PARTS'
          from pathlib import Path
          import hashlib
          import json

          out = Path('dist/android-play')
          bundle = out / 'ovc-release-unsigned.aab'
          parts_dir = Path('dist/android-play-parts')
          parts_dir.mkdir(parents=True, exist_ok=True)
          part_bytes = 24 * 1024 * 1024
          assert 0 < bundle.stat().st_size <= 2 * part_bytes, 'Unexpected bundle size: revise download partition count'
          parts = []
          bundle_hash = hashlib.sha256()
          with bundle.open('rb') as source:
              for index in range(1, 3):
                  chunk = source.read(part_bytes)
                  if not chunk:
                      break
                  name = f'{bundle.name}.part-{index:02d}'
                  (parts_dir / name).write_bytes(chunk)
                  bundle_hash.update(chunk)
                  parts.append({'name': name, 'size_bytes': len(chunk), 'sha256': hashlib.sha256(chunk).hexdigest()})
              assert not source.read(1), 'Bundle has more than two parts'

          report = json.loads((out / 'build-report.json').read_text())
          digest = bundle_hash.hexdigest()
          assert digest == report['sha256_unsigned'], 'Bundle changed after validation'
          assert sum(p['size_bytes'] for p in parts) == bundle.stat().st_size
          reconstruction_hash = hashlib.sha256()
          for part in parts:
              content = (parts_dir / part['name']).read_bytes()
              assert hashlib.sha256(content).hexdigest() == part['sha256']
              reconstruction_hash.update(content)
          assert reconstruction_hash.hexdigest() == digest

          manifest = {
              'schema_version': 1,
              'package': report['package'],
              'version_name': report['version_name'],
              'version_code': report['version_code'],
              'source_commit': report['source_commit'],
              'bundle_filename': bundle.name,
              'bundle_size_bytes': bundle.stat().st_size,
              'bundle_sha256': digest,
              'part_size_limit_bytes': part_bytes,
              'parts': parts,
          }
          (out / 'aab-parts.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (out / 'aab-parts.sha256').write_text(''.join(f"{p['sha256']}  {p['name']}\n" for p in parts))
          (out / 'aab-bundle.sha256').write_text(f'{digest}  {bundle.name}\n')
          (out / 'REASSEMBLE.txt').write_text(
              'Extract every artifact to one directory. Verify the parts with aab-parts.sha256, '
              'then concatenate parts in the order recorded in aab-parts.json. '
              'Verify the reconstructed AAB with aab-bundle.sha256 before private signing. '
              'The bundle is deliberately unsigned.\n'
          )
          # Each single-file artifact stays below the local 32 MiB download limit.
          # Reserve 64 KiB for ZIP metadata and artifact bookkeeping.
          cap = 32 * 1024 * 1024 - 64 * 1024
          for name in ['sorgenti-android.zip', 'bundletool.jar']:
              assert (out / name).stat().st_size < cap, f'{name} exceeds the download budget'
          metadata = [p for p in out.iterdir() if p.is_file() and p.suffix not in {'.aab', '.jar', '.zip'}]
          assert sum(p.stat().st_size for p in metadata) < cap, 'Metadata exceeds the download budget'
          print('Verified', len(parts), 'AAB parts; complete SHA-256:', digest)
          PY_PARTS
      - name: Save first unsigned bundle part for private signing
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-aab-part-01
          path: dist/android-play-parts/ovc-release-unsigned.aab.part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save second unsigned bundle part for private signing
        if: hashFiles('dist/android-play-parts/ovc-release-unsigned.aab.part-02') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-aab-part-02
          path: dist/android-play-parts/ovc-release-unsigned.aab.part-02
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save manifest, validation, checksums and build report
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-build-metadata
          path: |
            dist/android-play/*.json
            dist/android-play/*.xml
            dist/android-play/*.txt
            dist/android-play/*.sha256
            dist/android-play/icon-1024.png
          if-no-files-found: error
          retention-days: 7
      - name: Save exact prepared sources and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-sources
          path: dist/android-play/sorgenti-android.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save pinned bundletool for local validation
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-bundletool
          path: dist/android-play/bundletool.jar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Build temporary emulator APK with throwaway test key only
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Temporary emulator test only' -noprompt
          java -jar dist/android-play/bundletool.jar build-apks --bundle=dist/android-play/ovc-release-unsigned.aab --output="$RUNNER_TEMP/smoke.apks" --mode=universal --ks="$RUNNER_TEMP/smoke.jks" --ks-key-alias=smoke --ks-pass=pass:android --key-pass=pass:android
          unzip -p "$RUNNER_TEMP/smoke.apks" universal.apk > "$RUNNER_TEMP/smoke.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test installed release on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            mkdir -p dist/smoke
            adb install "$RUNNER_TEMP/smoke.apk"
            adb logcat -c
            adb shell am start -W -n com.otticavisualcare.app/.MainActivity
            sleep 40
            adb shell pidof com.otticavisualcare.app > dist/smoke/pid.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml dist/smoke/window.xml
            adb exec-out screencap -p > dist/smoke/launch.png
            adb logcat -d -v brief > dist/smoke/logcat.txt
            test -s dist/smoke/pid.txt
            if grep -E 'FATAL EXCEPTION|Unable to load script|JavascriptException' dist/smoke/logcat.txt; then exit 1; fi
            echo 'PASS release process alive; no native/JavaScript fatal exception in launch test' > dist/smoke/result.txt
      - name: Save emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-smoke-evidence
          path: dist/smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned diagnostics if any validation or smoke test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ovc-play-com-diagnostics-not-release
          path: |
            dist/android-play/*.json
            dist/android-play/*.xml
            dist/android-play/*.txt
            dist/android-play/*.sha256
            mobile-app/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 3
      - name: Remove temporary emulator signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/smoke.jks" "$RUNNER_TEMP/smoke.apks" "$RUNNER_TEMP/smoke.apk"
