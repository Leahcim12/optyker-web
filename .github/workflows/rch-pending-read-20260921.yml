name: Verifica diagnostica scontrino sospeso
on:
  push:
    branches: ['diagnostic/rch-pending-read-20260921']
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows PowerShell 5 compatibility and read-only safety
        shell: powershell
        run: ./tests/rch-pending-read.ps1
      - name: PowerShell 7 compatibility
        shell: pwsh
        run: ./tests/rch-pending-read.ps1
