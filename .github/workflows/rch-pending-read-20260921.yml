name: Verifica diagnostica scontrino sospeso
on:
  push:
    branches: [diagnostic/rch-pending-read-20260921]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse and run synthetic read-only diagnostic
        shell: ${{ matrix.shell }}
        run: ./tests/rch-pending-read.ps1
