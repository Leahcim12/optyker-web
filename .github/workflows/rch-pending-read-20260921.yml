name: Verifica diagnostica scontrino sospeso
on:
  push:
    branches: [diagnostic/rch-pending-read-20260921]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build bounded daily read diagnostic
        run: python scripts/build_rch_pending_v2.py
      - name: Windows PowerShell 5 read-only fixtures
        shell: powershell
        run: |
          ./tests/rch-pending-read.ps1
          ./tests/rch-pending-v2.ps1
      - name: PowerShell 7 read-only fixtures
        shell: pwsh
        run: ./tests/rch-pending-v2.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rch-diagnostic-day-v2
          path: rch-pending-v2-check/
          retention-days: 3
