name: Verifica diagnostica scontrino sospeso
on:
  push:
    branches: [diagnostic/rch-pending-read-20260921]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build diagnostic HTTP fix with unchanged fiscal allowlist
        run: |
          python scripts/build_rch_pending_v2.py
          python scripts/build_rch_pending_v3.py
      - name: Windows PowerShell 5 real loopback HTTP regression
        shell: powershell
        run: ./tests/rch-pending-http-v3.ps1
      - name: PowerShell 7 real loopback HTTP regression
        shell: pwsh
        run: ./tests/rch-pending-http-v3.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rch-diagnostic-http-v3
          path: rch-pending-v3-check/
          retention-days: 3
