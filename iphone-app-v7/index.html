<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>
<script>
const U='https://whgziwaegjzqsgcntesr.supabase.co';
const K='sb_publishable_DndhLvY32YeCmqWMNRi30g_dEDm8upv';
const API=U+'/functions/v1/optyker-mobile-api';
const APPT=U+'/functions/v1/optyker-mobile-appointments';
const CUSTOMER_AUTH=U+'/functions/v1/optyker-customer-auth';
const BOOKING_API=U+'/functions/v1/optyker-appointments-booking';
const CATALOG=U+'/functions/v1/optyker-shop-catalog';
const SHOP='https://otticavisualcare.it';
const BOOK='../booking/?source=iphone-app';
const sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById('app');
let state={session:null,me:null,home:null,appointments:[],tab:'home',frame:null,drawer:false,shopCategories:[],shopParent:null,shopCategory:null,shopProducts:[],shopPageInfo:null,shopLoading:false,shopError:'',chatMessages:[],chatLoading:false,chatSending:false,chatError:'',chatTimer:null};

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){try{return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v))}catch{return''}}
function fmtTime(v){try{return new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return''}}
function fmtDateTime(v){try{return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return''}}
function status(v){return v==='cancelled'?'Annullato':v==='completed'?'Completato':v==='no_show'?'Assente':'Confermato'}
function money(v,c='EUR'){const n=Number(v);if(!Number.isFinite(n))return '';try{return new Intl.NumberFormat('it-IT',{style:'currency',currency:c||'EUR'}).format(n)}catch{return n.toFixed(2)+' €'}}
function shopParent(){return (state.shopCategories||[]).find(x=>x.key===state.shopParent)||null}
function shopChild(){const p=shopParent();return p?.children?.find(x=>x.key===state.shopCategory)||null}
function shopMarkup(){
  const cats=state.shopCategories||[];
  if(!state.shopParent){
    return `<div class="page"><div class="header"><div class="eyebrow">OTTICA VISUAL CARE</div><h1>Shop</h1><div class="sub">Scegli la categoria</div></div>
      <div class="shopSource">Prodotti, prezzi e disponibilità aggiornati dal sito Shopify · APP 7.0</div>
      <div class="shopRootGrid">${cats.map(c=>`<button class="shopRoot" onclick="chooseShopParent('${esc(c.key)}')"><strong>${esc(c.title)}</strong><span>${esc(c.subtitle||'')}</span><div class="arrow">Scegli →</div></button>`).join('')}</div></div>`;
  }
  const parent=shopParent();
  if(!state.shopCategory){
    return `<div class="page"><div class="shopToolbar"><button class="shopBack" onclick="shopBackRoot()">‹ Shop</button></div><div class="header"><div class="eyebrow">OTTICA VISUAL CARE</div><h1>${esc(parent?.title||'Shop')}</h1><div class="sub">${esc(parent?.subtitle||'Scegli una categoria')}</div></div>
      <div class="shopSource">Collezioni collegate direttamente a otticavisualcare.it</div>
      <div class="shopSubGrid">${(parent?.children||[]).map(c=>`<button class="shopSub" onclick="chooseShopCategory('${esc(c.key)}')">${esc(c.title)}<small>Apri prodotti</small></button>`).join('')}</div></div>`;
  }
  const child=shopChild();
  const cards=(state.shopProducts||[]).map(p=>{
    const img=p.image?`<img class="productImage" src="${esc(p.image)}" alt="${esc(p.image_alt||p.title)}" loading="lazy">`:'<div class="productNoImage">Immagine non disponibile</div>';
    const min=money(p.min_price,p.currency),max=money(p.max_price,p.currency);
    const price=min&&max&&min!==max?`${min} – ${max}`:min||max||'';
    const compare=p.compare_at&&Number(p.compare_at)>Number(p.min_price)?`<span class="productCompare">${money(p.compare_at,p.currency)}</span>`:'';
    return `<button class="productCard" onclick="openProduct('${encodeURIComponent(p.handle||'')}','${encodeURIComponent(p.title||'Prodotto')}')">${img}<div class="productBody"><div class="productTitle">${esc(p.title)}</div><div class="productPrice">${price}${compare}</div><div class="productOpen">Apri nell’app →</div></div></button>`;
  }).join('');
  return `<div class="page"><div class="shopToolbar"><button class="shopBack" onclick="shopBackParent()">‹ ${esc(parent?.title||'Categorie')}</button></div><div class="header"><div class="eyebrow">OTTICA VISUAL CARE</div><h1>${esc(child?.title||'Prodotti')}</h1><div class="sub">Catalogo del sito</div></div>
    <div class="shopSource">Aggiornamento diretto Shopify</div>
    ${state.shopError?`<div class="error">${esc(state.shopError)}</div>`:''}
    ${state.shopLoading&&!state.shopProducts.length?'<div class="shopLoading">Caricamento prodotti…</div>':`<div class="productGrid">${cards||'<div class="empty">Nessun prodotto disponibile.</div>'}</div>`}
    ${state.shopPageInfo?.hasNextPage?`<button class="action secondary loadMore" onclick="loadMoreShop()" ${state.shopLoading?'disabled':''}>${state.shopLoading?'Caricamento…':'Mostra altri prodotti'}</button>`:''}
  </div>`;
}
function stripHtml(v){try{const d=new DOMParser().parseFromString(String(v||''),'text/html');return (d.body?.textContent||'').replace(/\n{3,}/g,'\n\n').trim()}catch{return String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}}
function nativeVariant(){
  const p=window.__optykerProduct||{},vars=Array.isArray(p.variants)?p.variants:[];if(!vars.length)return null;
  const selects=[...document.querySelectorAll('[data-product-option]')];
  if(!selects.length)return vars.find(v=>v.available)||vars[0];
  return vars.find(v=>selects.every((el,i)=>String(v['option'+(i+1)]??'')===String(el.value)))||vars.find(v=>v.available)||vars[0];
}
function updateNativeProductVariant(){
  const v=nativeVariant(),p=window.__optykerProduct||{};window.__optykerVariant=v||null;
  const price=document.getElementById('nativeProductPrice'),stock=document.getElementById('nativeProductStock'),buy=document.getElementById('nativeProductBuy');
  if(price&&v){const cp=Number(v.compare_at_price||0),pp=Number(v.price||0);price.innerHTML=money(v.price,p.currency||'EUR')+(cp>pp?'<span class="nativeProductCompare">'+money(v.compare_at_price,p.currency||'EUR')+'</span>':'')}
  if(stock&&v){stock.textContent=v.available?'Disponibile':'Non disponibile';stock.classList.toggle('out',!v.available)}
  if(buy)buy.disabled=!v||!v.available;
  const img=document.getElementById('nativeProductImage');if(img&&v?.featured_image)img.src=v.featured_image;
}
function renderNativeProduct(){
  const box=document.getElementById('nativeProductBody'),p=window.__optykerProduct;if(!box||!p)return;
  const vars=Array.isArray(p.variants)?p.variants:[],first=vars.find(v=>v.available)||vars[0]||null;window.__optykerVariant=first;
  const meaningful=(Array.isArray(p.options)?p.options:[]).filter(o=>!(o.name==='Title'&&o.values?.length===1&&o.values[0]==='Default Title'));
  const opts=meaningful.map((o,i)=>`<div class="productOption"><label>${esc(o.name||('Opzione '+(i+1)))}</label><select class="productSelect" data-product-option onchange="updateNativeProductVariant()">${(o.values||[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`).join('');
  const cp=Number(first?.compare_at_price||0),pp=Number(first?.price||0),compare=cp>pp?`<span class="nativeProductCompare">${money(first.compare_at_price,p.currency||'EUR')}</span>`:'';
  const image=(first?.featured_image||p.image||p.images?.[0]||'');
  box.innerHTML=`<div class="nativeProductCard">${image?`<img id="nativeProductImage" class="nativeProductHero" src="${esc(image)}" alt="${esc(p.title||'Prodotto')}">`:'<div class="nativeProductNoImage">Immagine non disponibile</div>'}<div class="nativeProductInfo"><div class="nativeProductVendor">${esc(p.vendor||'Ottica Visual Care')}</div><div class="nativeProductTitle">${esc(p.title||'Prodotto')}</div><div id="nativeProductPrice" class="nativeProductPrice">${first?money(first.price,p.currency||'EUR'):''}${compare}</div>${opts}<div class="productQtyRow"><div class="productOption" style="margin:0"><label>Quantità</label><input id="nativeProductQty" class="qtyInput" type="number" min="1" max="20" value="1" inputmode="numeric"></div><div id="nativeProductStock" class="productStock ${first?.available?'':'out'}">${first?.available?'Disponibile':'Non disponibile'}</div></div><button id="nativeProductBuy" class="buyButton" onclick="buyNativeProduct()" ${first?.available?'':'disabled'}>ACQUISTA</button><div class="buyHint">Il prodotto selezionato viene aggiunto al carrello ufficiale Ottica Visual Care.</div>${p.description?`<div class="productDesc">${esc(stripHtml(p.description))}</div>`:''}</div></div>`;
  updateNativeProductVariant();
}
window.updateNativeProductVariant=updateNativeProductVariant;
window.buyNativeProduct=()=>{const v=window.__optykerVariant||nativeVariant();if(!v?.id||!v.available)return;const q=Math.max(1,Math.min(20,Number(document.getElementById('nativeProductQty')?.value||1)||1));const id=String(v.id).replace(/\D/g,'');if(!id)return;window.location.href='https://otticavisualcare.it/cart/'+id+':'+q};
async function token(){const {data}=await sb.auth.getSession();return data?.session?.access_token||''}
async function call(url,action,payload={}){const t=await token();const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+t},body:JSON.stringify({action,payload})});const x=await r.json().catch(()=>({ok:false,error:'Risposta non valida'}));if(!r.ok||x?.ok===false)throw Error(x?.error||'Operazione non riuscita');return x}
async function customerAuth(action,payload={}){const r=await fetch(CUSTOMER_AUTH,{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({action,...payload})});const x=await r.json().catch(()=>({ok:false,error:'Risposta non valida'}));if(!r.ok||x?.ok===false)throw Error(x?.error||'Operazione non riuscita');return x}

function gonio(axis,eye,intl){
  const n=Number(String(axis??'').replace(',','.'));if(!Number.isFinite(n))return '<div class="tiny">Asse non disponibile</div>';
  const v=Math.max(0,Math.min(180,Math.abs(n))),d=intl?180-v:v,rad=d*Math.PI/180,cx=100,cy=83,r=66,x=cx+52*Math.cos(rad),y=cy-52*Math.sin(rad);
  const ticks=[0,45,90,135,180].map(t=>{const a=t*Math.PI/180,x1=cx+r*Math.cos(a),y1=cy-r*Math.sin(a),x2=cx+(r-8)*Math.cos(a),y2=cy-(r-8)*Math.sin(a),lx=cx+(r-18)*Math.cos(a),ly=cy-(r-18)*Math.sin(a)+3,lab=intl?180-t:t;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8a9ba8"/><text x="${lx}" y="${ly}" font-size="8" text-anchor="middle" fill="#6d8291">${lab}</text>`}).join('');
  return `<svg class="gonio" viewBox="0 0 200 118"><path d="M34 83 A66 66 0 0 1 166 83" fill="none" stroke="#657d8f" stroke-width="1.5"/><line x1="31" y1="83" x2="169" y2="83" stroke="#657d8f"/>${ticks}<circle cx="100" cy="83" r="3.5" fill="#fff" stroke="#657d8f"/><line x1="100" y1="83" x2="${x}" y2="${y}" stroke="#1769aa" stroke-width="4" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3" fill="#1769aa"/><text x="100" y="109" font-size="10" font-weight="800" text-anchor="middle" fill="#1769aa">${eye} AX ${Math.round(v)}°</text></svg>`;
}

async function loadChat(silent=false){
  if(state.chatLoading&&!silent)return;
  if(!silent){state.chatLoading=true;state.chatError='';if(state.tab==='chat')render()}
  try{const x=await call(API,'chat_get',{});state.chatMessages=Array.isArray(x.data)?x.data:[];state.chatError=''}
  catch(e){if(!silent)state.chatError=e?.message||'Chat non disponibile.'}
  finally{state.chatLoading=false;if(state.tab==='chat'){render();setTimeout(()=>{const b=document.getElementById('chatMessages');if(b)b.scrollTop=b.scrollHeight},40)}}
}
window.sendChat=async()=>{
  if(state.chatSending)return;
  const el=document.getElementById('chatInput'),message=el?.value?.trim()||'';if(!message)return;
  state.chatSending=true;if(el)el.disabled=true;const btn=document.getElementById('chatSend');if(btn){btn.disabled=true;btn.textContent='…'}
  try{await call(API,'chat_send',{message});if(el)el.value='';await loadChat(true)}
  catch(e){state.chatError=e?.message||'Messaggio non inviato.';render()}
  finally{state.chatSending=false;const b=document.getElementById('chatSend');if(b){b.disabled=false;b.textContent='Invia'}}
};

      <nav class="drawerNav">
        <button class="drawerBtn" data-nav="home" onclick="goTab('home')"><span class="navIcon">⌂</span>Dashboard</button>
        <button class="drawerBtn" data-nav="shop" onclick="goTab('shop')"><span class="navIcon">▣</span>Shop</button>
        <button class="drawerBtn" data-nav="rx" onclick="goTab('rx')"><span class="navIcon">◉</span>Prescrizione</button>
        <button class="drawerBtn" data-nav="agenda" onclick="goTab('agenda')"><span class="navIcon">◫</span>Agenda</button>
        <button class="drawerBtn" data-nav="chat" onclick="goTab('chat')"><span class="navIcon">◌</span>Chat <span id="chatBadge" class="drawerBadge ${Number(state.home?.unread_chat||0)>0?'':'hidden'}">${Number(state.home?.unread_chat||0)}</span></button>
        <button class="drawerBtn" data-nav="profile" onclick="goTab('profile')"><span class="navIcon">●</span>Profilo</button>
      </nav>
      <div class="drawerFoot">Ottica Visual Care · Area cliente Optyker</div>
    </aside>
    <main id="content" class="content"></main>
  </div>`;
  if(state.chatTimer)clearInterval(state.chatTimer);
  state.chatTimer=setInterval(()=>{if(state.tab==='chat')loadChat(true)},5000);
  render();
}
window.toggleDrawer=(open)=>{state.drawer=!!open;document.getElementById('drawer')?.classList.toggle('open',state.drawer);document.getElementById('drawerBackdrop')?.classList.toggle('open',state.drawer)};
window.goTab=(tab)=>{state.tab=tab;state.drawer=false;state.frame=null;toggleDrawer(false);if(tab==='chat')loadChat(false);else render()};
function render(){
  const content=document.getElementById('content');if(!content)return;
  content.innerHTML=page(state.tab);
  document.querySelectorAll('.drawerBtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.tab));
  if(state.tab==='chat')setTimeout(()=>{const b=document.getElementById('chatMessages');if(b)b.scrollTop=b.scrollHeight},30);
}
window.chooseShopParent=(key)=>{state.shopParent=key;state.shopCategory=null;state.shopProducts=[];state.shopPageInfo=null;state.shopError='';render()};
window.shopBackRoot=()=>{state.shopParent=null;state.shopCategory=null;state.shopProducts=[];state.shopPageInfo=null;state.shopError='';render()};
window.shopBackParent=()=>{state.shopCategory=null;state.shopProducts=[];state.shopPageInfo=null;state.shopError='';render()};
window.chooseShopCategory=async(key)=>{state.shopCategory=key;state.shopProducts=[];state.shopPageInfo=null;state.shopError='';state.shopLoading=true;render();try{const x=await call(CATALOG,'products',{category_key:key,first:24});state.shopProducts=x.data?.products||[];state.shopPageInfo=x.data?.pageInfo||null}catch(e){state.shopError=e?.message||'Impossibile caricare i prodotti.'}finally{state.shopLoading=false;render()}};
window.loadMoreShop=async()=>{if(!state.shopCategory||!state.shopPageInfo?.hasNextPage||state.shopLoading)return;state.shopLoading=true;render();try{const x=await call(CATALOG,'products',{category_key:state.shopCategory,first:24,after:state.shopPageInfo.endCursor});state.shopProducts=[...(state.shopProducts||[]),...(x.data?.products||[])];state.shopPageInfo=x.data?.pageInfo||null}catch(e){state.shopError=e?.message||'Impossibile caricare altri prodotti.'}finally{state.shopLoading=false;render()}};
window.openProduct=async(encodedHandle,encodedTitle)=>{const handle=decodeURIComponent(encodedHandle||'');const title=decodeURIComponent(encodedTitle||'Prodotto');if(!handle)return;state.frame='product';window.__optykerProduct=null;window.__optykerVariant=null;app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Prodotti</button><b style="flex:1;color:#11395d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</b></div><div id="nativeProductBody" class="nativeProduct"><div class="shopLoading">Caricamento prodotto…</div></div></div>`);try{const x=await call(CATALOG,'product',{handle});window.__optykerProduct=x.data||null;renderNativeProduct()}catch(e){const box=document.getElementById('nativeProductBody');if(box)box.innerHTML='<div class="productError">'+esc(e?.message||'Impossibile caricare il prodotto.')+'</div>'}};
window.openShop=()=>{state.frame='shop';app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Indietro</button><b style="flex:1;color:#11395d">Shop</b><span style="font-size:10px;font-weight:900;color:#1769aa">VISUAL CARE</span></div><iframe class="shopFrame" src="${SHOP}" title="Shop Ottica Visual Care" allow="payment *; clipboard-write *; fullscreen *" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`) };
window.modifyAppointment=(token)=>{if(!token)return;const c=state.home?.customer||state.me?.customer||{},url=BOOK+'&manage_token='+encodeURIComponent(token)+'&action=reschedule&first_name='+encodeURIComponent(c.name||'')+'&last_name='+encodeURIComponent(c.surname||'')+'&email='+encodeURIComponent(c.email||state.me?.email||'')+'&phone='+encodeURIComponent(c.phone||'');state.frame='booking';app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Agenda</button><b style="flex:1;color:#11395d">Modifica appuntamento</b></div><iframe class="bookingFrame" src="${url}" title="Modifica appuntamento"></iframe></div>`) };
window.deleteAppointment=async(token)=>{if(!token)return;if(!confirm('Vuoi eliminare questo appuntamento?'))return;try{const r=await fetch(BOOKING_API+'?api=manage&token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',payload:{}})});const x=await r.json().catch(()=>({ok:false,error:'Risposta non valida'}));if(!r.ok||x?.ok===false)throw Error(x?.error||'Impossibile eliminare l’appuntamento');const h=await call(APPT,'history');state.appointments=Array.isArray(h.data)?h.data:[];render()}catch(e){alert(e?.message||'Impossibile eliminare l’appuntamento')}};
window.openBooking=()=>{const c=state.home?.customer||state.me?.customer||{},url=BOOK+'&first_name='+encodeURIComponent(c.name||'')+'&last_name='+encodeURIComponent(c.surname||'')+'&email='+encodeURIComponent(c.email||state.me?.email||'')+'&phone='+encodeURIComponent(c.phone||'');state.frame='booking';app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Agenda</button><b style="flex:1;color:#11395d">Prenota appuntamento</b></div><iframe class="bookingFrame" src="${url}" title="Prenotazione appuntamento"></iframe></div>`) };
window.closeFrame=async()=>{document.getElementById('frameLayer')?.remove();state.frame=null;window.__optykerProduct=null;window.__optykerVariant=null;if(state.tab==='agenda'||state.tab==='home'){try{const x=await call(APPT,'history');state.appointments=Array.isArray(x.data)?x.data:[];render()}catch{}}};
window.logout=async()=>{if(state.chatTimer)clearInterval(state.chatTimer);await sb.auth.signOut();state={session:null,me:null,home:null,appointments:[],tab:'home',frame:null,drawer:false,shopCategories:[],shopParent:null,shopCategory:null,shopProducts:[],shopPageInfo:null,shopLoading:false,shopError:'',chatMessages:[],chatLoading:false,chatSending:false,chatError:'',chatTimer:null};login()};

async function boot(){
  const {data}=await sb.auth.getSession();state.session=data.session||null;if(!state.session){login();return}
  app.innerHTML='<div class="center"><div class="spinner"></div></div>';
  try{
    const [meX,homeX,apptX]=await Promise.all([call(API,'me'),call(API,'customer_home'),call(APPT,'history')]);
    state.me=meX.data||null;
    if(state.me?.role!=='customer')throw Error('Questa app è riservata ai clienti Ottica Visual Care.');
    state.home=homeX.data||null;state.appointments=Array.isArray(apptX.data)?apptX.data:[];state.tab='home';
    try{const catX=await call(CATALOG,'categories');state.shopCategories=Array.isArray(catX.data)?catX.data:[]}catch(e){state.shopCategories=[];state.shopError='Catalogo temporaneamente non disponibile.'}
    shell();
  }catch(e){
    if(/AUTH_|session/i.test(String(e.message))){await sb.auth.signOut();login('Sessione scaduta. Accedi di nuovo.')}else login(e.message||'Accesso non disponibile');
  }
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){newPasswordScreen();return}
  if(event==='SIGNED_OUT'){login();return}
  if(event==='SIGNED_IN'&&session&&!state.me)setTimeout(boot,0);
});
boot();
</script>
</body></html>
