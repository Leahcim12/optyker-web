<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orari · Ottica Visual Care</title>
<style>
:root{--blue:#1769aa;--navy:#11395d;--bg:#f4f7fa;--line:#dce6ee;--text:#19384d;--muted:#6d8291;--card:#fff;--danger:#b42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 36px}
.head{text-align:center;margin-bottom:14px}.head h1{color:var(--navy);font-size:30px;margin:4px 0}.head p{color:var(--muted);font-size:13px;margin:0;line-height:1.45}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(17,57,93,.06)}
.hours{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #e3ebf1;border-radius:13px;padding:13px;background:#fbfdff}
.day{font-size:13px;font-weight:900;color:var(--navy)}.date{display:block;font-size:10px;color:#8b9ba7;margin-top:2px}.time{font-size:13px;font-weight:850;text-align:right}.closed{color:var(--danger)}.badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#e7f2fb;color:var(--blue);font-size:8px;font-weight:900}.note{font-size:9px;color:var(--muted);margin-top:4px;max-width:250px}
.loading,.error{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}.error{color:var(--danger)}
.updated{text-align:center;font-size:10px;color:#83939f;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div style="font-size:10px;letter-spacing:.12em;font-weight:900;color:#1769aa">OTTICA VISUAL CARE</div>
    <h1>Orari</h1>
    <p>Gli orari vengono aggiornati automaticamente in base a chiusure e variazioni straordinarie.</p>
  </div>
  <div class="card">
    <div id="hours" class="loading">Caricamento orari…</div>
  </div>
  <div id="updated" class="updated"></div>
</div>
<script>
const API='https://whgziwaegjzqsgcntesr.supabase.co/functions/v1/optyker-appointments-booking?api=hours';
const DAYS=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function txt(h){
  if(!h||h.active===false)return 'Chiuso';
  const a=(h.start_time||'').slice(0,5),b=(h.end_time||'').slice(0,5),c=(h.start_time_2||'').slice(0,5),d=(h.end_time_2||'').slice(0,5);
  if(a&&b&&c&&d)return a+'–'+b+' · '+c+'–'+d;
  if(a&&b)return a+'–'+b;
  return 'Chiuso';
}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x}
(async()=>{
  try{
    const r=await fetch(API,{cache:'no-store'}),x=await r.json();
    if(!r.ok||x?.ok===false)throw Error(x?.error||'Impossibile caricare gli orari');
    const base={};(x.store_hours||[]).forEach(h=>base[Number(h.weekday)]=h);
    const ov={};(x.store_overrides||[]).forEach(h=>ov[String(h.schedule_date).slice(0,10)]=h);
    const m=mondayOf(new Date());
    const rows=[];
    for(let i=0;i<7;i++){
      const d=new Date(m);d.setDate(m.getDate()+i);
      const k=ymd(d),day=i+1,o=ov[k],h=o||base[day],closed=!h||h.active===false;
      rows.push('<div class="row"><div><div class="day">'+DAYS[day]+(o?'<span class="badge">Aggiornato</span>':'')+'</div><span class="date">'+d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+'</span></div><div class="time '+(closed?'closed':'')+'">'+esc(txt(h))+(o&&o.notes?'<div class="note">'+esc(o.notes)+'</div>':'')+'</div></div>');
    }
    document.getElementById('hours').className='hours';
    document.getElementById('hours').innerHTML=rows.join('');
    document.getElementById('updated').textContent='Aggiornato automaticamente da Optyker';
  }catch(e){
    document.getElementById('hours').className='error';
    document.getElementById('hours').textContent=e?.message||'Orari temporaneamente non disponibili.';
  }
})();
</script>
</body></html>
