<script id="optykerLocalAuth">
(function(){
  const STORE='optyker_supabase_session_v1';
  const listeners=new Set();

  function apiBase(url){return String(url||'').replace(/\/$/,'')+'/auth/v1'}
  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(STORE)||'null');
      return x&&x.access_token?x:null;
    }catch{return null}
  }
  function save(s){
    try{
      if(s)localStorage.setItem(STORE,JSON.stringify(s));
      else localStorage.removeItem(STORE);
    }catch{}
  }
  function sessionFrom(x,prev){
    if(!x||!x.access_token)return null;
    const ttl=Number(x.expires_in||3600);
    return {
      access_token:x.access_token,
      refresh_token:x.refresh_token||prev?.refresh_token||'',
      token_type:x.token_type||'bearer',
      expires_in:ttl,
      expires_at:Date.now()+ttl*1000,
      user:x.user||prev?.user||null
    };
  }
  function emit(event,session){
    listeners.forEach(fn=>{try{fn(event,session)}catch{}});
  }
  function errObj(x,status){
    const msg=x?.msg||x?.message||x?.error_description||x?.error||('Errore '+status);
    return {message:String(msg),status};
  }

  window.supabase={
    createClient(base,key){
      const AUTH=apiBase(base);

      async function refreshIfNeeded(){
        let s=load();
        if(!s)return null;
        if(Number(s.expires_at||0)>Date.now()+60000)return s;
        if(!s.refresh_token){save(null);return null}
        try{
          const r=await fetch(AUTH+'/token?grant_type=refresh_token',{
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':key},
            body:JSON.stringify({refresh_token:s.refresh_token})
          });
          const x=await r.json().catch(()=>({}));
          if(!r.ok){save(null);return null}
          s=sessionFrom(x,s);save(s);return s;
        }catch{return s}
      }

      const auth={
        async getSession(){
          const s=await refreshIfNeeded();
          return {data:{session:s},error:null};
        },
        async signInWithPassword({email,password}){
          try{
            const r=await fetch(AUTH+'/token?grant_type=password',{
              method:'POST',
              headers:{'Content-Type':'application/json','apikey':key},
              body:JSON.stringify({email,password})
            });
            const x=await r.json().catch(()=>({}));
            if(!r.ok)return {data:{session:null,user:null},error:errObj(x,r.status)};
            const s=sessionFrom(x,null);save(s);emit('SIGNED_IN',s);
            return {data:{session:s,user:s?.user||null},error:null};
          }catch(e){
            return {data:{session:null,user:null},error:{message:e?.message||'Impossibile collegarsi'}};
          }
        },
        async updateUser(payload){
          const s=await refreshIfNeeded();
          if(!s?.access_token)return {data:{user:null},error:{message:'Sessione scaduta'}};
          try{
            const r=await fetch(AUTH+'/user',{
              method:'PUT',
              headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+s.access_token},
              body:JSON.stringify(payload||{})
            });
            const x=await r.json().catch(()=>({}));
            if(!r.ok)return {data:{user:null},error:errObj(x,r.status)};
            s.user=x;save(s);emit('USER_UPDATED',s);
            return {data:{user:x},error:null};
          }catch(e){
            return {data:{user:null},error:{message:e?.message||'Impossibile aggiornare l’utente'}};
          }
        },
        async signOut(){
          const s=load();save(null);
          if(s?.access_token){
            fetch(AUTH+'/logout',{
              method:'POST',
              headers:{'apikey':key,'Authorization':'Bearer '+s.access_token}
            }).catch(()=>{});
          }
          emit('SIGNED_OUT',null);
          return {error:null};
        },
        onAuthStateChange(fn){
          if(typeof fn==='function')listeners.add(fn);
          const h=location.hash||'',q=location.search||'';
          const params=new URLSearchParams((h.startsWith('#')?h.slice(1):h)||q.replace(/^\?/,''));
          const access=params.get('access_token'),refresh=params.get('refresh_token'),type=params.get('type');
          if(access){
            const s={access_token:access,refresh_token:refresh||'',token_type:'bearer',expires_in:3600,expires_at:Date.now()+3600000,user:null};
            save(s);
            setTimeout(()=>emit(type==='recovery'?'PASSWORD_RECOVERY':'SIGNED_IN',s),0);
          }
          return {data:{subscription:{unsubscribe(){listeners.delete(fn)}}}};
        }
      };
      return {auth};
    }
  };
})();
</script>

async function ensurePushSubscription(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw Error('Le notifiche non sono supportate su questo dispositivo.');

  const pub=String(cfg.data?.vapid_public_key||'');if(!pub)throw Error('Servizio notifiche non disponibile.');
  const reg=await navigator.serviceWorker.register('./sw.js?v=13');
  await navigator.serviceWorker.ready;
  let permission=Notification.permission;
  if(permission!=='granted')permission=await Notification.requestPermission();
  if(permission!=='granted')throw Error('Autorizza le notifiche per usare il Timer.');
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(pub)});
  const j=sub.toJSON(),keys=j.keys||{};
  await call(API,'push_subscribe',{endpoint:sub.endpoint,p256dh:keys.p256dh||'',auth:keys.auth||'',user_agent:navigator.userAgent||''});
  return sub;
}

function gonio(axis,eye,intl){
  const n=Number(String(axis??'').replace(',','.'));if(!Number.isFinite(n))return '<div class="tiny">Asse non disponibile</div>';
  const v=Math.max(0,Math.min(180,Math.abs(n))),d=intl?180-v:v,rad=d*Math.PI/180,cx=100,cy=83,r=66,x=cx+52*Math.cos(rad),y=cy-52*Math.sin(rad);
  const ticks=[0,45,90,135,180].map(t=>{const a=t*Math.PI/180,x1=cx+r*Math.cos(a),y1=cy-r*Math.sin(a),x2=cx+(r-8)*Math.cos(a),y2=cy-(r-8)*Math.sin(a),lx=cx+(r-18)*Math.cos(a),ly=cy-(r-18)*Math.sin(a)+3,lab=intl?180-t:t;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8a9ba8"/><text x="${lx}" y="${ly}" font-size="8" text-anchor="middle" fill="#6d8291">${lab}</text>`}).join('');
  return `<svg class="gonio" viewBox="0 0 200 118"><path d="M34 83 A66 66 0 0 1 166 83" fill="none" stroke="#657d8f" stroke-width="1.5"/><line x1="31" y1="83" x2="169" y2="83" stroke="#657d8f"/>${ticks}<circle cx="100" cy="83" r="3.5" fill="#fff" stroke="#657d8f"/><line x1="100" y1="83" x2="${x}" y2="${y}" stroke="#1769aa" stroke-width="4" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3" fill="#1769aa"/><text x="100" y="109" font-size="10" font-weight="800" text-anchor="middle" fill="#1769aa">${eye} AX ${Math.round(v)}°</text></svg>`;
}

function compressChatImage(file,max=1600,q=.82){return new Promise((resolve,reject)=>{if(!file||(file.type&&!/^image\//.test(file.type))){reject(Error('Formato foto non supportato'));return}const rd=new FileReader();rd.onerror=()=>reject(Error('Impossibile leggere la foto'));rd.onload=()=>{const im=new Image();im.onerror=()=>reject(Error('Foto non valida'));im.onload=()=>{let w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);resolve(cv.toDataURL('image/jpeg',q))};im.src=rd.result};rd.readAsDataURL(file)})}

window.openProduct=async(encodedHandle,encodedTitle)=>{const handle=decodeURIComponent(encodedHandle||'');const title=decodeURIComponent(encodedTitle||'Prodotto');if(!handle)return;state.frame='product';window.__optykerProduct=null;window.__optykerVariant=null;app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Prodotti</button><b style="flex:1;color:#11395d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</b></div><div id="nativeProductBody" class="nativeProduct"><div class="shopLoading">Caricamento prodotto…</div></div></div>`);try{const x=await call(CATALOG,'product',{handle});window.__optykerProduct=x.data||null;renderNativeProduct()}catch(e){const box=document.getElementById('nativeProductBody');if(box)box.innerHTML='<div class="productError">'+esc(e?.message||'Impossibile caricare il prodotto.')+'</div>'}};
window.openShop=()=>{state.frame='shop';app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Indietro</button><b style="flex:1;color:#11395d">Shop</b><span style="font-size:10px;font-weight:900;color:#1769aa">VISUAL CARE</span></div><iframe class="shopFrame" src="${SHOP}" title="Shop Ottica Visual Care" allow="payment *; clipboard-write *; fullscreen *" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`) };
window.modifyAppointment=(token)=>{if(!token)return;const c=state.home?.customer||state.me?.customer||{},url=BOOK+'&manage_token='+encodeURIComponent(token)+'&action=reschedule&first_name='+encodeURIComponent(c.name||'')+'&last_name='+encodeURIComponent(c.surname||'')+'&email='+encodeURIComponent(c.email||state.me?.email||'')+'&phone='+encodeURIComponent(c.phone||'');state.frame='booking';app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Agenda</button><b style="flex:1;color:#11395d">Modifica appuntamento</b></div><iframe class="bookingFrame" src="${url}" title="Modifica appuntamento"></iframe></div>`) };
window.deleteAppointment=async(token)=>{if(!token)return;if(!confirm('Vuoi eliminare questo appuntamento?'))return;try{const r=await fetch(BOOKING_API+'?api=manage&token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',payload:{}})});const x=await r.json().catch(()=>({ok:false,error:'Risposta non valida'}));if(!r.ok||x?.ok===false)throw Error(x?.error||'Impossibile eliminare l’appuntamento');const h=await call(APPT,'history');state.appointments=Array.isArray(h.data)?h.data:[];render()}catch(e){alert(e?.message||'Impossibile eliminare l’appuntamento')}};
window.openBooking=()=>{const c=state.home?.customer||state.me?.customer||{},url=BOOK+'&fresh='+Date.now()+'&first_name='+encodeURIComponent(c.name||'')+'&last_name='+encodeURIComponent(c.surname||'')+'&email='+encodeURIComponent(c.email||state.me?.email||'')+'&phone='+encodeURIComponent(c.phone||'');state.frame='booking';app.insertAdjacentHTML('beforeend',`<div id="frameLayer"><div class="frameBar"><button onclick="closeFrame()">‹ Agenda</button><b style="flex:1;color:#11395d">Prenota appuntamento</b></div><iframe class="bookingFrame" src="${url}" title="Prenotazione appuntamento"></iframe></div>`) };
window.closeFrame=async()=>{document.getElementById('frameLayer')?.remove();state.frame=null;window.__optykerProduct=null;window.__optykerVariant=null;if(state.tab==='agenda'||state.tab==='home'){try{const x=await call(APPT,'history');state.appointments=Array.isArray(x.data)?x.data:[];render()}catch{}}};
window.logout=async()=>{if(state.chatTimer)clearInterval(state.chatTimer);await sb.auth.signOut();state={session:null,me:null,home:null,appointments:[],tab:'home',frame:null,drawer:false,shopCategories:[],shopParent:null,shopCategory:null,shopProducts:[],shopPageInfo:null,shopLoading:false,shopError:'',cart:[],chatMessages:[],chatLoading:false,chatSending:false,chatError:'',chatTimer:null,chatAttachment:null,timers:[],timerLoading:false,timerError:'',staffHome:null,staffAgenda:[],staffAgendaStart:'',staffShifts:null,staffShiftMonth:'',staffClients:[],staffClientDetail:null,staffClientSearch:'',staffOrders:null,staffThreads:[],staffSelectedThread:'',staffMessages:[],staffLoading:false,staffError:''};login()};

async function boot(){
  const {data}=await sb.auth.getSession();state.session=data.session||null;if(!state.session){login();return}
  app.innerHTML='<div class="center"><div class="spinner"></div></div>';
  try{
    const meX=await call(API,'me');
    state.me=meX.data||null;
    if(state.me?.role==='staff'){
      const homeX=await call(API,'staff_home');
      state.staffHome=homeX.data||null;state.tab='staff_home';state.staffShiftMonth=staffMonthKey(new Date());state.staffAgendaStart=staffDateKey(staffMonday(new Date()));
      staffShell();
      return;
    }
    if(state.me?.role!=='customer')throw Error('Questa email non è associata a un profilo Optyker.');
    const [homeX,apptX]=await Promise.all([call(API,'customer_home'),call(APPT,'history')]);
    loadCart();
    state.home=homeX.data||null;state.appointments=Array.isArray(apptX.data)?apptX.data:[];const requestedTab=new URLSearchParams(location.search).get('tab');state.tab=requestedTab==='timer'?'timer':'home';
    try{const catX=await call(CATALOG,'categories');state.shopCategories=Array.isArray(catX.data)?catX.data:[]}catch(e){state.shopCategories=[];state.shopError='Catalogo temporaneamente non disponibile.'}
    shell();
    if(state.tab==='timer')loadTimers(false);
  }catch(e){
    if(/AUTH_|session/i.test(String(e.message))){await sb.auth.signOut();login('Sessione scaduta. Accedi di nuovo.')}else login(e.message||'Accesso non disponibile');
  }
}
(function(){
  const h=location.hash||'',q=location.search||'';
  if(/type=recovery|access_token=|refresh_token=|[?&]code=/.test(h+q)){
    history.replaceState(null,'',location.pathname);
  }
})();
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){newPasswordScreen();return}
  if(event==='SIGNED_OUT'){login();return}
  if(event==='SIGNED_IN'&&session&&!state.me)setTimeout(boot,0);
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v=13').catch(()=>{});
boot();
</script>
